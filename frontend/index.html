<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Note Taker</title>
    <!-- The backend port is random per launch, hence 127.0.0.1:*. Images load from the
         backend (/captures/{id}/image), so img-src needs it too. No inline styles: use
         classes. The dev server's relaxations are added by electron.vite.config.ts. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: http://127.0.0.1:*; connect-src 'self' http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
